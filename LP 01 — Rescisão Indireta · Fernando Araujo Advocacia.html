<body>
  <div id="__bundler_placeholder">Loading LP 01 — Rescisão Indireta...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tyle>\n<\u002Fhelmet>\n<div class=\"lp\" data-canvas-width=\"1440\" data-canvas-height=\"6600\" data-document-role=\"page\" data-label=\"LP 01 · Rescisão Indireta\">\n\n<!-- ===================== COMPONENTE: Cabeçalho ===================== -->\n<header class=\"site-header\" data-component=\"Cabecalho\">\n<div class=\"wrap\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 64px\">\n<a href=\"#hero\" aria-label=\"Fernando Araujo Advocacia — início\" style=\"display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff\">\n<span aria-hidden=\"true\" style=\"width: 36px; height: 36px; flex: none; display: flex; align-items: center; justify-content: center; border: 1.5px solid #d7c57b; border-radius: 4px; color: #d7c57b; font-weight: 900; font-size: 14px; letter-spacing: .04em\">FA<\u002Fspan>\n<span style=\"display: flex; flex-direction: column; line-height: 1.15\">\n<span style=\"font-weight: 800; font-size: 15px; color: #fff\">Fernando Araujo<\u002Fspan>\n<span class=\"logo-sub\" style=\"font-weight: 700; font-size: 10px; letter-spacing: .22em; color: #d7c57b\">ADVOCACIA<\u002Fspan>\n<\u002Fspan>\n<\u002Fa>\n<a class=\"btn-wa btn-wa--sm\" href=\"{{waLink}}\" target=\"_blank\" rel=\"noopener\">\n<svg aria-hidden=\"true\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7.9 20A9 9 0 1 0 4 16.1L2 22Z\"><\u002Fpath><\u002Fsvg>\nFalar no WhatsApp\n<\u002Fa>\n<\u002Fdiv>\n<\u002Fheader>\n\n<main>\n\n<!-- ===================== COMPONENTE: Hero ===================== -->\n<section id=\"hero\" class=\"tone-dark\" data-component=\"Hero\" style=\"overflow: hidden\">\n<div class=\"wrap hero-grid\">\n<div class=\"hero-text hero-enter\">\n<p class=\"eyebrow\">Rescisão indireta · Advocacia trabalhista<\u002Fp>\n<h1 class=\"heading-1\" style=\"color: #fff\">Cansado de sofrer no trabalho, mas com medo de pedir demissão e <span style=\"color: #d7c57b\">sair sem nada?<\u002Fspan><\u002Fh1>\n<p class=\"lead\" style=\"margin-top: 18px; max-width: 40rem\">Com a rescisão indireta, você pode deixar o emprego recebendo as mesmas verbas de uma demissão sem justa causa. Salário atrasado, FGTS não depositado e assédio moral são faltas graves da empresa.<\u002Fp>\n<div style=\"margin-top: 26px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start\">\n<a class=\"btn-wa btn-wa--block\" href=\"{{waLink}}\" target=\"_blank\" rel=\"noopener\" style=\"min-height: 56px; font-size: 17px\">\n<svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7.9 20A9 9 0 1 0 4 16.1L2 22Z\"><\u002Fpath><\u002Fsvg>\nQuero analisar meu caso\n<\u002Fa>\n<p style=\"margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 14px; line-height: 1.5; color: #c9d1dc\">\n<svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#d7c57b\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none; margin-top: 2px\"><rect width=\"18\" height=\"11\" x=\"3\" y=\"11\" rx=\"2\" ry=\"2\"><\u002Frect><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"><\u002Fpath><\u002Fsvg>\n<span>Atendimento sigiloso. Fale com um advogado antes de tomar qualquer decisão.<\u002Fspan>\n<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"hero-enter-2\" style=\"align-self: end\">\n<div class=\"hero-photo\" role=\"img\" aria-label=\"Espaço reservado para a foto do advogado\" style=\"background: #13233a; border: 1px solid #23354f; border-bottom: 0; border-radius: 8px 8px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; color: #c9d1dc\">\n<svg aria-hidden=\"true\" width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#d7c57b\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"12\" cy=\"7\" r=\"4\"><\u002Fcircle><\u002Fsvg>\n<span style=\"font-size: 14px; font-weight: 700\">[FOTO DO ADVOGADO — HERO]<\u002Fspan>\n<span style=\"font-size: 13px\">Fundo escuro, terno preto. Recorte até a cintura, alinhado à base da seção.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== COMPONENTE: Lista de situações ===================== -->\n<section id=\"o-que-e\" class=\"sec\" data-component=\"ListaDeSituacoes\" style=\"background: #fff\">\n<div class=\"wrap\">\n<div style=\"max-width: 46rem\">\n<p class=\"eyebrow\">Entenda seu direito<\u002Fp>\n<h2 class=\"heading-2\">O que é a rescisão indireta?<\u002Fh2>\n<p class=\"lead\" style=\"margin-top: 16px\">A rescisão indireta está prevista no artigo 483 da CLT e funciona como uma “justa causa do empregador”. Quando a empresa comete uma falta grave, você pode encerrar o contrato e receber todas as verbas como se tivesse sido demitido sem justa causa.<\u002Fp>\n<\u002Fdiv>\n<h3 style=\"margin: 40px 0 16px; font-size: 18px; font-weight: 800; color: #14181f\">Situações que podem dar direito:<\u002Fh3>\n<ul class=\"cards-situacoes\" style=\"list-style: none; margin: 0; padding: 0\">\n<li style=\"display: flex; gap: 14px; align-items: flex-start; padding: 20px; background: #f5f6f8; border: 1px solid #e3e6eb; border-radius: 8px\">\n<span aria-hidden=\"true\" style=\"width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; background: #f8f3e3; border-radius: 6px; color: #7d621c\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><polyline points=\"12 6 12 12 16 14\"><\u002Fpolyline><\u002Fsvg><\u002Fspan>\n<span style=\"font-size: 16px; font-weight: 700; line-height: 1.4; padding-top: 2px\">Atraso ou falta de pagamento de salários<\u002Fspan>\n<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; padding: 20px; background: #f5f6f8; border: 1px solid #e3e6eb; border-radius: 8px\">\n<span aria-hidden=\"true\" style=\"width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; background: #f8f3e3; border-radius: 6px; color: #7d621c\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"6\" width=\"20\" height=\"12\" rx=\"2\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"2\"><\u002Fcircle><path d=\"M6 12h.01M18 12h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span style=\"font-size: 16px; font-weight: 700; line-height: 1.4; padding-top: 2px\">Atraso ou falta de depósito do FGTS<\u002Fspan>\n<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; padding: 20px; background: #f5f6f8; border: 1px solid #e3e6eb; border-radius: 8px\">\n<span aria-hidden=\"true\" style=\"width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; background: #f8f3e3; border-radius: 6px; color: #7d621c\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"><\u002Fpath><path d=\"M12 9v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span style=\"font-size: 16px; font-weight: 700; line-height: 1.4; padding-top: 2px\">Agressões físicas ou verbais<\u002Fspan>\n<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; padding: 20px; background: #f5f6f8; border: 1px solid #e3e6eb; border-radius: 8px\">\n<span aria-hidden=\"true\" style=\"width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; background: #f8f3e3; border-radius: 6px; color: #7d621c\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"m17 8 5 5\"><\u002Fpath><path d=\"m22 8-5 5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span style=\"font-size: 16px; font-weight: 700; line-height: 1.4; padding-top: 2px\">Assédio moral ou sexual<\u002Fspan>\n<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; padding: 20px; background: #f5f6f8; border: 1px solid #e3e6eb; border-radius: 8px\">\n<span aria-hidden=\"true\" style=\"width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; background: #f8f3e3; border-radius: 6px; color: #7d621c\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"><\u002Fpath><path d=\"M12 8v4\"><\u002Fpath><path d=\"M12 16h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span style=\"font-size: 16px; font-weight: 700; line-height: 1.4; padding-top: 2px\">Trabalho em condições perigosas sem EPI<\u002Fspan>\n<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; padding: 20px; background: #f5f6f8; border: 1px solid #e3e6eb; border-radius: 8px\">\n<span aria-hidden=\"true\" style=\"width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; background: #f8f3e3; border-radius: 6px; color: #7d621c\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 22h14\"><\u002Fpath><path d=\"M5 2h14\"><\u002Fpath><path d=\"M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22\"><\u002Fpath><path d=\"M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span style=\"font-size: 16px; font-weight: 700; line-height: 1.4; padding-top: 2px\">Horas extras não pagas<\u002Fspan>\n<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: flex-start; padding: 20px; background: #f5f6f8; border: 1px solid #e3e6eb; border-radius: 8px\">\n<span aria-hidden=\"true\" style=\"width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; background: #f8f3e3; border-radius: 6px; color: #7d621c\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 2v2\"><\u002Fpath><path d=\"M14 2v2\"><\u002Fpath><path d=\"M6 2v2\"><\u002Fpath><path d=\"M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span style=\"font-size: 16px; font-weight: 700; line-height: 1.4; padding-top: 2px\">Intervalo de almoço suprimido ou reduzido<\u002Fspan>\n<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== COMPONENTE: Verbas ===================== -->\n<section id=\"verbas\" class=\"sec tone-dark\" data-component=\"Verbas\">\n<div class=\"wrap split\">\n<div>\n<p class=\"eyebrow\">Seus direitos<\u002Fp>\n<h2 class=\"heading-2\" style=\"color: #fff\">O que você pode receber<\u002Fh2>\n<p class=\"lead\" style=\"margin-top: 16px\">Com a rescisão indireta reconhecida, você recebe as mesmas verbas de uma demissão sem justa causa:<\u002Fp>\n<div style=\"margin-top: 28px\">\n<a class=\"btn-wa btn-wa--block\" href=\"{{waLink}}\" target=\"_blank\" rel=\"noopener\">\n<svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7.9 20A9 9 0 1 0 4 16.1L2 22Z\"><\u002Fpath><\u002Fsvg>\nQuero saber se tenho direito\n<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<ul style=\"list-style: none; margin: 0; padding: 0; border-top: 1px solid #23354f\">\n<li style=\"display: flex; gap: 14px; align-items: center; padding: 18px 0; border-bottom: 1px solid #23354f; font-size: 17px; font-weight: 700\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#d7c57b\" stroke-width=\"2.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Saldo de salário<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: center; padding: 18px 0; border-bottom: 1px solid #23354f; font-size: 17px; font-weight: 700\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#d7c57b\" stroke-width=\"2.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Aviso prévio indenizado<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: center; padding: 18px 0; border-bottom: 1px solid #23354f; font-size: 17px; font-weight: 700\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#d7c57b\" stroke-width=\"2.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Férias vencidas e proporcionais + 1/3<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: center; padding: 18px 0; border-bottom: 1px solid #23354f; font-size: 17px; font-weight: 700\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#d7c57b\" stroke-width=\"2.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>13º salário proporcional<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: center; padding: 18px 0; border-bottom: 1px solid #23354f; font-size: 17px; font-weight: 700\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#d7c57b\" stroke-width=\"2.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Saque do FGTS + multa de 40%<\u002Fli>\n<li style=\"display: flex; gap: 14px; align-items: center; padding: 18px 0; border-bottom: 1px solid #23354f; font-size: 17px; font-weight: 700\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#d7c57b\" stroke-width=\"2.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex: none\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><span>Seguro-desemprego <span style=\"font-weight: 600; color: #c9d1dc\">(se cumprir os requisitos)<\u002Fspan><\u002Fspan><\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== COMPONENTE: TST ===================== -->\n<section id=\"tst\" class=\"sec\" data-component=\"TST\" style=\"background: #f5f6f8\">\n<div class=\"wrap\">\n<div class=\"tst-card\" style=\"background: #fff; border: 1px solid #e3e6eb; border-radius: 12px\">\n<div>\n<p class=\"eyebrow\">Entendimento dos tribunais<\u002Fp>\n<h2 class=\"heading-2\">O TST já pacificou o assunto<\u002Fh2>\n<p class=\"lead\" style=\"margin-top: 16px\">Nos Temas 70 e 85, o Tribunal Superior do Trabalho fixou o entendimento de que a ausência ou irregularidade no recolhimento do FGTS, o não pagamento de horas extras e a supressão do intervalo configuram falta grave do empregador e autorizam a rescisão indireta.<\u002Fp>\n<div style=\"margin-top: 28px\">\n<a class=\"btn-wa btn-wa--block\" href=\"{{waLink}}\" target=\"_blank\" rel=\"noopener\">\n<svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7.9 20A9 9 0 1 0 4 16.1L2 22Z\"><\u002Fpath><\u002Fsvg>\nConversar com um advogado\n<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"temas\" aria-label=\"Temas do TST citados\">\n<div style=\"padding-top: 16px; border-top: 2px solid #c4a54f\">\n<p style=\"margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #7d621c\">Tema<\u002Fp>\n<p style=\"margin: 2px 0 0; font-size: clamp(3rem, 2rem + 4cqi, 5rem); font-weight: 900; line-height: 1; letter-spacing: -.03em; color: #0c1726\">70<\u002Fp>\n<p style=\"margin: 8px 0 0; font-size: 14px; color: #4a5160\">Tribunal Superior do Trabalho<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding-top: 16px; border-top: 2px solid #c4a54f\">\n<p style=\"margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #7d621c\">Tema<\u002Fp>\n<p style=\"margin: 2px 0 0; font-size: clamp(3rem, 2rem + 4cqi, 5rem); font-weight: 900; line-height: 1; letter-spacing: -.03em; color: #0c1726\">85<\u002Fp>\n<p style=\"margin: 8px 0 0; font-size: 14px; color: #4a5160\">Tribunal Superior do Trabalho<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== COMPONENTE: Atendimento (replicar do site institucional) ===================== -->\n<section id=\"atendimento\" class=\"sec\" data-component=\"Atendimento\" style=\"background: #fff\">\n<div class=\"wrap\">\n<div style=\"max-width: 46rem\">\n<p class=\"eyebrow\">[Eyebrow do site]<\u002Fp>\n<h2 class=\"heading-2\">Como funciona o atendimento<\u002Fh2>\n<p class=\"lead\" style=\"margin-top: 16px\"><span style=\"background: #f8f3e3; color: #7d621c; font-weight: 700; padding: 0 4px; border-radius: 3px\">[Replicar texto, passos e layout da seção equivalente do site institucional — print não anexado]<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<ol class=\"steps\" style=\"list-style: none; margin: 40px 0 0; padding: 0\">\n<li style=\"padding: 24px; border: 1px dashed #c9d1dc; border-radius: 8px; background: #f5f6f8\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 800; letter-spacing: .06em; color: #7d621c\">/01<\u002Fp>\n<p style=\"margin: 12px 0 0; font-size: 18px; font-weight: 800\">[Passo 1 — título]<\u002Fp>\n<p style=\"margin: 8px 0 0; font-size: 15px; color: #4a5160\">[Texto do passo, como no site]<\u002Fp>\n<\u002Fli>\n<li style=\"padding: 24px; border: 1px dashed #c9d1dc; border-radius: 8px; background: #f5f6f8\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 800; letter-spacing: .06em; color: #7d621c\">/02<\u002Fp>\n<p style=\"margin: 12px 0 0; font-size: 18px; font-weight: 800\">[Passo 2 — título]<\u002Fp>\n<p style=\"margin: 8px 0 0; font-size: 15px; color: #4a5160\">[Texto do passo, como no site]<\u002Fp>\n<\u002Fli>\n<li style=\"padding: 24px; border: 1px dashed #c9d1dc; border-radius: 8px; background: #f5f6f8\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 800; letter-spacing: .06em; color: #7d621c\">/03<\u002Fp>\n<p style=\"margin: 12px 0 0; font-size: 18px; font-weight: 800\">[Passo 3 — título]<\u002Fp>\n<p style=\"margin: 8px 0 0; font-size: 15px; color: #4a5160\">[Texto do passo, como no site]<\u002Fp>\n<\u002Fli>\n<li style=\"padding: 24px; border: 1px dashed #c9d1dc; border-radius: 8px; background: #f5f6f8\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 800; letter-spacing: .06em; color: #7d621c\">/04<\u002Fp>\n<p style=\"margin: 12px 0 0; font-size: 18px; font-weight: 800\">[Passo 4 — título]<\u002Fp>\n<p style=\"margin: 8px 0 0; font-size: 15px; color: #4a5160\">[Texto do passo, como no site]<\u002Fp>\n<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== COMPONENTE: Não dá direito ===================== -->\n<section id=\"nao-da-direito\" class=\"sec\" data-component=\"NaoDaDireito\" style=\"background: #f5f6f8\">\n<div class=\"wrap\">\n<div style=\"max-width: 46rem\">\n<p class=\"eyebrow\">Seja realista<\u002Fp>\n<h2 class=\"heading-2\">Situações que, em regra, não dão direito à rescisão indireta<\u002Fh2>\n<\u002Fdiv>\n<ol class=\"cards-nao\" style=\"list-style: none; margin: 40px 0 0; padding: 0\">\n<li style=\"display: flex; flex-direction: column; gap: 10px; padding: 26px 24px; background: #fff; border: 1px solid #e3e6eb; border-radius: 8px\">\n<span style=\"font-size: 14px; font-weight: 800; letter-spacing: .06em; color: #7d621c\">/01<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 800; line-height: 1.3\">Assédio sem provas<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #4a5160\">Humilhações ou assédio sem nenhum registro: mensagens, áudios, e-mails ou testemunhas.<\u002Fp>\n<\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 10px; padding: 26px 24px; background: #fff; border: 1px solid #e3e6eb; border-radius: 8px\">\n<span style=\"font-size: 14px; font-weight: 800; letter-spacing: .06em; color: #7d621c\">/02<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 800; line-height: 1.3\">Assédio isolado, sem repetição<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #4a5160\">Para caracterizar assédio, a conduta precisa se repetir. O que conta é a repetição, não o tempo de empresa: 10 dias seguidos de assédio já podem configurar a reiteração. Um episódio isolado, em regra, não basta.<\u002Fp>\n<\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 10px; padding: 26px 24px; background: #fff; border: 1px solid #e3e6eb; border-radius: 8px\">\n<span style=\"font-size: 14px; font-weight: 800; letter-spacing: .06em; color: #7d621c\">/03<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 800; line-height: 1.3\">Atraso pontual de FGTS já regularizado<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #4a5160\">Um atraso isolado que a empresa já acertou é diferente de recolhimento irregular e pode não ser suficiente para caracterizar falta grave.<\u002Fp>\n<\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 10px; padding: 26px 24px; background: #fff; border: 1px solid #e3e6eb; border-radius: 8px\">\n<span style=\"font-size: 14px; font-weight: 800; letter-spacing: .06em; color: #7d621c\">/04<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 800; line-height: 1.3\">Insatisfação pessoal com o trabalho<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #4a5160\">Não gostar do emprego ou das tarefas, sem nenhum descumprimento da lei por parte do empregador.<\u002Fp>\n<\u002Fli>\n<li style=\"display: flex; flex-direction: column; gap: 10px; padding: 26px 24px; background: #fff; border: 1px solid #e3e6eb; border-radius: 8px\">\n<span style=\"font-size: 14px; font-weight: 800; letter-spacing: .06em; color: #7d621c\">/05<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 800; line-height: 1.3\">Desvio de função eventual<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #4a5160\">Fazer de vez em quando uma tarefa diferente, sem habitualidade, pode não configurar falta grave.<\u002Fp>\n<\u002Fli>\n<li style=\"display: flex; flex-direction: column; justify-content: space-between; gap: 20px; padding: 26px 24px; background: #0c1726; border: 1px solid #0c1726; border-radius: 8px\">\n<p style=\"margin: 0; font-size: 19px; font-weight: 800; line-height: 1.4; color: #fff\">Ficou em dúvida se o seu caso se encaixa? <span style=\"color: #d7c57b\">Um advogado avalia isso com você.<\u002Fspan><\u002Fp>\n<a class=\"btn-wa\" href=\"{{waLink}}\" target=\"_blank\" rel=\"noopener\" style=\"align-self: stretch\">\n<svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7.9 20A9 9 0 1 0 4 16.1L2 22Z\"><\u002Fpath><\u002Fsvg>\nTirar minha dúvida\n<\u002Fa>\n<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== COMPONENTE: Quem sou (replicar do site institucional) ===================== -->\n<section id=\"quem-sou\" class=\"sec tone-dark\" data-component=\"QuemSou\">\n<div class=\"wrap split split--photo\">\n<div role=\"img\" aria-label=\"Espaço reservado para a segunda foto do advogado\" style=\"aspect-ratio: 4/5; max-height: 520px; width: 100%; background: #13233a; border: 1px solid #23354f; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; color: #c9d1dc\">\n<svg aria-hidden=\"true\" width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#d7c57b\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"12\" cy=\"7\" r=\"4\"><\u002Fcircle><\u002Fsvg>\n<span style=\"font-size: 14px; font-weight: 700\">[FOTO DO ADVOGADO — QUEM SOU]<\u002Fspan>\n<span style=\"font-size: 13px\">Usar foto diferente da do hero<\u002Fspan>\n<\u002Fdiv>\n<div>\n<p class=\"eyebrow\">Quem sou<\u002Fp>\n<h2 class=\"heading-2\" style=\"color: #fff\">[Título da seção “Quem sou” — copiar do site]<\u002Fh2>\n<p class=\"lead\" style=\"margin-top: 16px\">[Parágrafo 1 — texto da seção “Quem sou” do site institucional, sem alterações.]<\u002Fp>\n<p class=\"lead\" style=\"margin-top: 14px\">[Parágrafo 2 — idem.]<\u002Fp>\n<p style=\"margin: 28px 0 0; padding-top: 20px; border-top: 1px solid #23354f; font-size: 15px; color: #c9d1dc\"><strong style=\"color: #fff; font-weight: 800\">Fernando Araujo<\u002Fstrong> · OAB/[UF] [NÚMERO]<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== COMPONENTE: FAQ ===================== -->\n<section id=\"faq\" class=\"sec faq\" data-component=\"FAQ\" style=\"background: #fff\">\n<div class=\"wrap split\">\n<div>\n<p class=\"eyebrow\">Dúvidas<\u002Fp>\n<h2 class=\"heading-2\">Perguntas frequentes<\u002Fh2>\n<\u002Fdiv>\n<div style=\"border-top: 1px solid #e3e6eb\">\n<details style=\"border-bottom: 1px solid #e3e6eb\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; padding: 20px 0; font-size: 17px; font-weight: 800; line-height: 1.4\">Preciso sair do emprego antes de entrar com a ação?<svg class=\"chev\" aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#7d621c\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 0 22px; font-size: 16px; line-height: 1.65; color: #4a5160\">Não. E não saia antes de falar com um advogado: se a falta grave não for reconhecida, a sua saída pode ser tratada como pedido de demissão, e você perde verbas como a multa do FGTS e o seguro-desemprego.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid #e3e6eb\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; padding: 20px 0; font-size: 17px; font-weight: 800; line-height: 1.4\">Posso continuar trabalhando enquanto o processo corre?<svg class=\"chev\" aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#7d621c\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 0 22px; font-size: 16px; line-height: 1.65; color: #4a5160\">Em alguns casos, como atraso de salário ou de FGTS, a lei permite continuar trabalhando até a decisão (art. 483, §3º, da CLT). O advogado avalia o que é mais seguro no seu caso.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid #e3e6eb\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; padding: 20px 0; font-size: 17px; font-weight: 800; line-height: 1.4\">Que provas eu preciso reunir?<svg class=\"chev\" aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#7d621c\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 0 22px; font-size: 16px; line-height: 1.65; color: #4a5160\">Extrato do FGTS (pelo app do FGTS), holerites, cartões de ponto, mensagens, áudios, e-mails e o contato de colegas que possam testemunhar. Se não tiver tudo, não tem problema: o advogado orienta o que buscar.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid #e3e6eb\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; padding: 20px 0; font-size: 17px; font-weight: 800; line-height: 1.4\">A empresa vai ficar sabendo que procurei um advogado?<svg class=\"chev\" aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#7d621c\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 0 22px; font-size: 16px; line-height: 1.65; color: #4a5160\">Não. O atendimento é sigiloso.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid #e3e6eb\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; padding: 20px 0; font-size: 17px; font-weight: 800; line-height: 1.4\">Quanto tempo demora o processo?<svg class=\"chev\" aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#7d621c\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 0 22px; font-size: 16px; line-height: 1.65; color: #4a5160\">Depende da vara, do caso e da possibilidade de acordo. No atendimento você recebe uma estimativa para a sua situação.<\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid #e3e6eb\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; padding: 20px 0; font-size: 17px; font-weight: 800; line-height: 1.4\">Quanto custa a consulta?<svg class=\"chev\" aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#7d621c\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 0 22px; font-size: 16px; line-height: 1.65; color: #4a5160\"><span style=\"background: #f8f3e3; color: #7d621c; font-weight: 700; padding: 0 4px; border-radius: 3px\">[CONFIRMAR COM O FERNANDO]<\u002Fspan><\u002Fp>\n<\u002Fdetails>\n<details style=\"border-bottom: 1px solid #e3e6eb\">\n<summary style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; padding: 20px 0; font-size: 17px; font-weight: 800; line-height: 1.4\">Vocês atendem online?<svg class=\"chev\" aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#7d621c\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<p style=\"margin: 0; padding: 0 0 22px; font-size: 1
